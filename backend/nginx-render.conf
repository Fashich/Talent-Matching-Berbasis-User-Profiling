# backend/nginx-render.conf
# Konfigurasi Nginx di dalam container Render. Semua request diarahkan ke
# index.php (front controller) — Router.php custom EduPKL yang urus dispatch
# berdasarkan REQUEST_URI, jadi tidak butuh rewrite rule per-modul.

server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php;

    client_max_body_size 20M;

    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Blok akses ke file config/dokumentasi internal
    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~ ^/(database|docs)/ {
        deny all;
    }
}
